# Auto-scaling of the infrastructure (MLOps level 3): 2 -> 6 API pods on CPU load.
# Inference is CPU-bound (UNet++, vectorizer), so CPU utilisation is the right signal.
# Requires metrics-server (Docker Desktop / minikube addon / cloud clusters ship it).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: archigen-api
  namespace: archigen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: archigen-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 85}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies: [{type: Pods, value: 2, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300               # avoid flapping after a traffic spike
      policies: [{type: Pods, value: 1, periodSeconds: 120}]
