# kubectl apply -k k8s/        (see k8s/README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - configmap.yaml
  - models-pvc.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
labels:
  - pairs:
      app.kubernetes.io/name: archigen-api
      app.kubernetes.io/part-of: archigen-3d
images:
  - name: ghcr.io/khawlahawari/archigen-studio
    newTag: latest          # CI can pin a commit SHA here: kustomize edit set image ...:<sha>
