# Scheduled (batch) retraining check: every Monday, evaluate the retraining policy
# (drift, accumulated user corrections, model age; thresholds in params.yaml) and open a
# GitHub issue with the reasons and the retraining command when retraining is due.
# Training itself needs a GPU, so it runs on Kaggle (kaggle/archigen_kaggle_run3.ipynb pattern).
name: Scheduled retraining check

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  retraining-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the policy's dependencies
        run: pip install pyyaml numpy scipy

      - name: Evaluate the retraining policy
        id: policy
        run: |
          set +e
          python -m src.mlops.retraining_policy > decision.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat decision.txt

      - name: Keep the decision as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: retraining-decision
          path: models/metrics/retraining_decision.json

      - name: Open an issue when retraining is due
        if: steps.policy.outputs.exit_code == '10'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('models/metrics/retraining_decision.json', 'utf8'));
            const title = `Retraining due (${d.evaluated_at.slice(0, 10)})`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'retraining' });
            if (open.data.some(i => i.title === title)) return;
            await github.rest.issues.create({ ...context.repo, title, labels: ['retraining'],
              body: ['**Why:**', ...d.reasons.map(r => `- ${r}`), '',
                     `**How:** \`${d.how_to_retrain}\``, '',
                     'Then: evaluate on the test split, `scripts/install_run.py`, A/B the new model as challenger (GET /ab/status).'].join('\n') });
