name: ArchiGen 3D MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase (github.repository keeps the owner's capitals)
  IMAGE_NAME: khawlahawari/archigen-studio
  # CI has neither the datasets nor trained checkpoints: ONNX export / parity / latency /
  # API steps run on explicitly-labelled UNTRAINED weights to test the plumbing only.
  # Real training & metrics: see README (train_facade, train_floorplan, src.evaluation.evaluate).
  ARCHIGEN_CI_UNTRAINED: "1"

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export Models to ONNX
        run: |
          python -m src.mlops.export_onnx

      - name: Strict Numerical Parity Test (Delta < 1e-5)
        run: |
          python -m src.mlops.onnx_verifier

      - name: Inference Latency Benchmark & SLA
        run: |
          python -m src.mlops.benchmark_latency

      - name: MLflow Model Registry Promotion (Staging → Production)
        run: |
          python -m src.mlops.model_registry

      - name: Verify DVC Remote Configuration & Versioning
        run: |
          python -m src.mlops.dvc_remote

      - name: Drift Baseline & Continuous Monitoring Verification (MLOps Level 3)
        run: |
          python -m src.mlops.drift_detector --mode baseline
          python -m src.mlops.drift_detector --mode evaluate --domain floorplan

      - name: Run Unit Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run API Monitoring Tests
        run: |
          pytest tests/monitoring/ -v --tb=short

  real-models:
    name: Real trained models (checksums, ONNX parity, API)
    needs: test-and-verify
    runs-on: ubuntu-latest
    env:
      ARCHIGEN_CI_UNTRAINED: "0"          # this job tests the REAL weights from the GitHub Release
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Download the released weights and verify their SHA-256 (models/manifest.json)
        id: pull
        run: |
          python scripts/models.py pull --profile runtime --skip-if-unpublished
          if python scripts/models.py check --profile runtime; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        if: steps.pull.outputs.ready == 'true'
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Export the real models to ONNX and check numerical parity
        if: steps.pull.outputs.ready == 'true'
        run: |
          python -m src.mlops.export_onnx
          python -m src.mlops.onnx_verifier

      - name: API tests on the real models
        if: steps.pull.outputs.ready == 'true'
        run: pytest tests/test_api.py tests/monitoring/ -v --tb=short

  infra-validate:
    name: Validate Kubernetes, Prometheus and Grafana configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Kubernetes manifests against the official schemas (kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s/ | ./kubeconform -strict -summary -kubernetes-version 1.30.0 -

      - name: Prometheus configuration and alert rules (promtool)
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/cfg" --entrypoint promtool prom/prometheus:v2.53.0 check rules /cfg/alerts.yml
          sed 's#/etc/prometheus/alerts.yml#/cfg/alerts.yml#' monitoring/prometheus/prometheus.yml > monitoring/prometheus/ci.yml
          docker run --rm -v "$PWD/monitoring/prometheus:/cfg" --entrypoint promtool prom/prometheus:v2.53.0 check config /cfg/ci.yml

      - name: Grafana dashboard is valid JSON
        run: python -c "import json; d=json.load(open('monitoring/grafana/dashboards/archigen.json')); print(len(d['panels']), 'panels')"

  load-test:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt fastapi uvicorn[standard]

      - name: Export Models (needed by API service)
        run: |
          python -m src.mlops.export_onnx

      - name: Start API Server
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health

      - name: Run Locust Load Test
        run: |
          locust -f locustfile.py --host http://localhost:8000 \
            --headless -u 25 -r 5 -t 60s --csv locust_results

      - name: Publish Load Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: locust_results_*

  # Continuous deployment of the static showcase (frontend/public/showcase) to GitHub Pages.
  # Requires: Settings > Pages > Build and deployment > Source = "GitHub Actions".
  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Showcase as Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/public/showcase

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  docker-build-verify:
    needs: test-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) || '' }}

      - name: Run Container & Verify Healthcheck
        if: github.ref == 'refs/heads/main'
        run: |
          # --no-deps: /health and /system/info need neither MLflow nor MinIO
          docker compose up --build -d --no-deps archigen-api
          sleep 15
          curl -f --retry 5 --retry-delay 3 http://localhost:8000/health
          curl -f http://localhost:8000/system/info
          docker compose logs --tail=50 archigen-api
          docker compose down

  docker-push-release:
    needs: docker-build-verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Tag
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
