name: ArchiGen 3D MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # CI has neither the datasets nor trained checkpoints: ONNX export / parity / latency /
  # API steps run on explicitly-labelled UNTRAINED weights to test the plumbing only.
  # Real training & metrics: see README (train_facade, train_floorplan, src.evaluation.evaluate).
  ARCHIGEN_CI_UNTRAINED: "1"

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Export Models to ONNX
        run: |
          python -m src.mlops.export_onnx

      - name: Strict Numerical Parity Test (Delta < 1e-5)
        run: |
          python -m src.mlops.onnx_verifier

      - name: Inference Latency Benchmark & SLA
        run: |
          python -m src.mlops.benchmark_latency

      - name: MLflow Model Registry Promotion (Staging → Production)
        run: |
          python -m src.mlops.model_registry

      - name: Verify DVC Remote Configuration & Versioning
        run: |
          python -m src.mlops.dvc_remote

      - name: Drift Baseline & Continuous Monitoring Verification (MLOps Level 3)
        run: |
          python -m src.mlops.drift_detector --mode baseline
          python -m src.mlops.drift_detector --mode evaluate --domain floorplan

      - name: Run Unit Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run API Monitoring Tests
        run: |
          pytest tests/monitoring/ -v --tb=short

  load-test:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt fastapi uvicorn[standard]

      - name: Export Models (needed by API service)
        run: |
          python -m src.mlops.export_onnx

      - name: Start API Server
        run: |
          uvicorn src.api.main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health

      - name: Run Locust Load Test
        run: |
          locust -f locustfile.py --host http://localhost:8000 \
            --headless -u 25 -r 5 -t 60s --csv locust_results

      - name: Publish Load Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: locust_results_*

  docker-build-verify:
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ github.ref == 'refs/heads/main' && format('{0}/{1}:{2}', env.REGISTRY, env.IMAGE_NAME, github.sha) || '' }}

      - name: Run Container & Verify Healthcheck
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose up --build -d archigen-api
          sleep 15
          curl -f --retry 5 --retry-delay 3 http://localhost:8000/health
          curl -f http://localhost:8000/system/info
          docker compose logs --tail=50 archigen-api
          docker compose down

  docker-push-release:
    needs: docker-build-verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Release Tag
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
