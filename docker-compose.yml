version: '3.8'

services:
  archigen-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archigen-3d-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
      - PYTHONUNBUFFERED=1
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_ENDPOINT_URL=http://minio:9000
      - DVC_REMOTE_URL=s3://archigen-dvc
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      - mlflow-server
      - minio

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: archigen-3d-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow-artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow-data:/mlflow-artifacts

  minio:
    image: quay.io/minio/minio:latest
    container_name: archigen-3d-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: archigen-3d-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin); do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      /usr/bin/mc mb myminio/archigen-dvc --ignore-existing;
      /usr/bin/mc mb myminio/mlflow-artifacts --ignore-existing;
      /usr/bin/mc anonymous set download myminio/archigen-dvc;
      echo 'MinIO buckets initialized: archigen-dvc, mlflow-artifacts';
      exit 0;
      "

volumes:
  mlflow-data:
  minio-data:
