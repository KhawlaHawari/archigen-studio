# Prometheus scrapes the ArchiGen API's /metrics endpoint (src/api/observability.py).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: archigen-api
    metrics_path: /metrics
    static_configs:
      # Docker Compose service name; for an API running on the host use host.docker.internal:8000
      - targets: ["archigen-api:8000", "host.docker.internal:8000"]
